name: Build data & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # daily 05:00 HKT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fresh bus data from the government APIs. Those servers sometimes time out or block
      # for a while, so retry once; if it still fails, reuse the data on the live site (from
      # the last good build) instead of failing the whole deploy.
      - name: Bus data
        run: |
          if npm run data; then exit 0; fi
          echo "::warning::bus data download failed, retrying in 60 s"
          sleep 60
          if npm run data; then exit 0; fi
          echo "::warning::bus data download failed again, reusing the live site's bus-data.json"
          curl -fsSL --retry 3 -o public/bus-data.json https://kenyeung201206.github.io/hk-bus-time/bus-data.json \
            || echo "::warning::kept the bus-data.json in the repository"
      - run: npm test
      - run: npm run build
      - name: Add Android app download
        run: mkdir -p dist/download && cp releases/hk-bus-time.apk dist/download/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
